[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "product-evidence-guard"
version = "1.0.0"
description = "Local multi-source product fact verification with traceable evidence and conflict classification."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "tianhao8687"}]
dependencies = []

[project.optional-dependencies]
documents = [
  "python-docx>=1.1,<1.3",
  "openpyxl>=3.1,<3.2",
  "pypdf>=5,<7",
  "pypdfium2>=5.12,<6",
]
openvino = [
  "openvino>=2026.1,<2027",
  "openvino-genai>=2026.1,<2027",
  "rapidocr>=3.9.1,<3.10",
  "huggingface-hub>=0.34,<1",
  "numpy>=1.26",
  "pillow>=10.4",
]
all = [
  "python-docx>=1.1,<1.3",
  "openpyxl>=3.1,<3.2",
  "pypdf>=5,<7",
  "pypdfium2>=5.12,<6",
  "openvino>=2026.1,<2027",
  "openvino-genai>=2026.1,<2027",
  "rapidocr>=3.9.1,<3.10",
  "huggingface-hub>=0.34,<1",
  "numpy>=1.26",
  "pillow>=10.4",
]

[project.scripts]
product-evidence-guard = "product_evidence_guard.cli:main"

[tool.setuptools.packages.find]
include = ["product_evidence_guard*"]
