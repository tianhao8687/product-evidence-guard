name: Product Evidence Guard tests

on:
  push:
    branches: [main, 'codex/**']
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    name: Linux / Python 3.11
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install test dependencies
        run: >-
          python -m pip install
          pillow
          "python-docx>=1.1,<1.3"
          "openpyxl>=3.1,<3.2"
          "pypdf>=5,<7"
          "pypdfium2>=5.12,<6"
      - name: Compile
        run: python -m compileall -q product_evidence_guard scripts tests
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Run demo smoke test
        run: |
          python -m product_evidence_guard analyze samples/demo --output demo-output
          python - <<'PY'
          import json
          from pathlib import Path
          summary = json.loads(Path('demo-output/run-summary.json').read_text(encoding='utf-8'))
          assert summary['candidate_count'] == 13
          assert summary['fact_group_count'] == 5
          assert summary['blocking_conflict_count'] == 2
          PY

  windows:
    name: Windows / PowerShell / Python 3.11
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install test dependencies
        shell: powershell
        run: |
          python -m pip install `
            pillow `
            "python-docx>=1.1,<1.3" `
            "openpyxl>=3.1,<3.2" `
            "pypdf>=5,<7" `
            "pypdfium2>=5.12,<6"
      - name: Compile
        run: python -m compileall -q product_evidence_guard scripts tests
      - name: Run Windows end-to-end test
        shell: powershell
        run: >-
          powershell.exe -NoProfile -ExecutionPolicy Bypass
          -File .\tests\test.ps1
